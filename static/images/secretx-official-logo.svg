<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250">
  <defs>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="250" fill="#000000"/>
  
  <!-- Main text "SECRET" -->
  <text x="40" y="130" font-family="'Arial Black', 'Impact', sans-serif" font-size="90" font-weight="900" fill="#FFFFFF" letter-spacing="8">
    SECRET
  </text>
  
  <!-- Large glowing red X -->
  <g filter="url(#strongGlow)">
    <path d="M 400 30 L 510 150" 
          stroke="#FF0044" 
          stroke-width="35" 
          stroke-linecap="round"
          fill="none"
          opacity="0.9"/>
    <path d="M 510 30 L 400 150" 
          stroke="#FF0044" 
          stroke-width="35" 
          stroke-linecap="round"
          fill="none"
          opacity="0.9"/>
  </g>
  
  <!-- Gray metallic slash accent -->
  <path d="M 510 30 L 555 150" 
        stroke="#888888" 
        stroke-width="4" 
        stroke-linecap="round"
        fill="none"
        opacity="0.6"/>
  
  <!-- "tech®" text -->
  <text x="350" y="175" font-family="'Arial', sans-serif" font-size="28" font-weight="400" fill="#FFFFFF" letter-spacing="6">
    tech<tspan font-size="16" baseline-shift="super">®</tspan>
  </text>
  
  <!-- "Built different." tagline -->
  <text x="150" y="220" font-family="'Arial', sans-serif" font-size="24" font-weight="300" fill="#CCCCCC" letter-spacing="2">
    Built different.
  </text>
</svg>

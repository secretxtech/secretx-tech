<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0033;stop-opacity:1" />
    </linearGradient>
    <filter id="glowIcon">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0a12" rx="20"/>
  
  <!-- Main X shape - First slash (red) -->
  <path d="M 25 15 L 75 85" 
        stroke="url(#redGradIcon)" 
        stroke-width="12" 
        stroke-linecap="round"
        fill="none"
        filter="url(#glowIcon)"/>
  
  <!-- Main X shape - Second slash (blue) -->
  <path d="M 75 15 L 25 85" 
        stroke="url(#blueGradIcon)" 
        stroke-width="12" 
        stroke-linecap="round"
        fill="none"
        filter="url(#glowIcon)"/>
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#ffffff" opacity="0.9" filter="url(#glowIcon)"/>
</svg>

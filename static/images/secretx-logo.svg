<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00aaff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0033;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0a0a12" stroke="url(#blueGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Tech grid pattern -->
  <g opacity="0.15" stroke="#00aaff" stroke-width="0.5" fill="none">
    <line x1="50" y1="0" x2="50" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="0" y1="50" x2="200" y2="50"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="150" x2="200" y2="150"/>
  </g>
  
  <!-- Main X shape - First slash (red) -->
  <path d="M 60 40 L 140 160" 
        stroke="url(#redGrad)" 
        stroke-width="16" 
        stroke-linecap="round"
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Main X shape - Second slash (blue) -->
  <path d="M 140 40 L 60 160" 
        stroke="url(#blueGrad)" 
        stroke-width="16" 
        stroke-linecap="round"
        fill="none"
        filter="url(#glow)"/>
  
  <!-- Center tech detail -->
  <circle cx="100" cy="100" r="8" fill="#00aaff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Corner tech accents -->
  <path d="M 35 35 L 35 50 M 35 35 L 50 35" 
        stroke="#00aaff" 
        stroke-width="2" 
        stroke-linecap="round"
        fill="none"
        opacity="0.5"/>
  <path d="M 165 35 L 165 50 M 165 35 L 150 35" 
        stroke="#ff0033" 
        stroke-width="2" 
        stroke-linecap="round"
        fill="none"
        opacity="0.5"/>
  <path d="M 35 165 L 35 150 M 35 165 L 50 165" 
        stroke="#ff0033" 
        stroke-width="2" 
        stroke-linecap="round"
        fill="none"
        opacity="0.5"/>
  <path d="M 165 165 L 165 150 M 165 165 L 150 165" 
        stroke="#00aaff" 
        stroke-width="2" 
        stroke-linecap="round"
        fill="none"
        opacity="0.5"/>
</svg>
